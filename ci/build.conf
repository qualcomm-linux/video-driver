#!/bin/bash
# Video Driver Build Configuration
# Sstate-Cache and Build Optimization Settings
# SPDX-License-Identifier: GPL-2.0-only

set -euo pipefail

# Cache Directory Configuration
export CACHE_BASE_DIR="${CACHE_BASE_DIR:-/efsx/qli/video-driver}"
export BUILD_CACHE_DIR="${CACHE_BASE_DIR}/build-cache"
export OBJECT_CACHE_DIR="${BUILD_CACHE_DIR}/object-cache"
export MODULE_CACHE_DIR="${BUILD_CACHE_DIR}/module-cache"
export CCACHE_DIR="${CACHE_BASE_DIR}/ccache"
export DL_DIR="${CACHE_BASE_DIR}/downloads"
export METADATA_DIR="${BUILD_CACHE_DIR}/metadata"

# Kernel Build Configuration
export KERNEL_SRC="${KERNEL_SRC:-/path/to/kernel}"
export KERNEL_BUILD_DIR="${KERNEL_BUILD_DIR:-${KERNEL_SRC}}"
export VIDEO_ROOT="${VIDEO_ROOT:-.}"

# Build Optimization Flags
export ENABLE_SSTATE_CACHE="${ENABLE_SSTATE_CACHE:-1}"
export ENABLE_CCACHE="${ENABLE_CCACHE:-1}"
export ENABLE_INCREMENTAL_BUILD="${ENABLE_INCREMENTAL_BUILD:-1}"
export CCACHE_MAXSIZE="${CCACHE_MAXSIZE:-50G}"

# Disk Monitoring Configuration
export MIN_FREE_SPACE_STOPTASKS="${MIN_FREE_SPACE_STOPTASKS:-1073741824}"  # 1GB
export MIN_FREE_SPACE_HALT="${MIN_FREE_SPACE_HALT:-104857600}"            # 100MB
export MONITOR_DISK_SPACE="${MONITOR_DISK_SPACE:-1}"

# Cache Cleanup Configuration
export CACHE_RETENTION_DAYS="${CACHE_RETENTION_DAYS:-15}"
export AUTO_CLEANUP_ENABLED="${AUTO_CLEANUP_ENABLED:-1}"

# Build Signature Configuration
export BUILD_SIGNATURE_FILE="${METADATA_DIR}/build.sig"
export DEPENDENCY_HASH_FILE="${METADATA_DIR}/deps.hash"

# Logging Configuration
export BUILD_LOG_DIR="${BUILD_CACHE_DIR}/logs"
export VERBOSE_CACHE_LOGGING="${VERBOSE_CACHE_LOGGING:-0}"

# Initialize cache directories
mkdir -p "${OBJECT_CACHE_DIR}" "${MODULE_CACHE_DIR}" "${CCACHE_DIR}" \
         "${DL_DIR}" "${METADATA_DIR}" "${BUILD_LOG_DIR}"

# Export for use in build scripts
export CACHE_CONFIG_LOADED=1