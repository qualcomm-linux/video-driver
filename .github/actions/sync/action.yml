---
name: Sync Action
description: Checks out the correct code depending on event and repo context.

inputs:
  event_name:
    description: Event type that triggered the workflow (e.g., pull_request, pull_request_target, push, workflow_call, workflow_dispatch)
    required: true
  pr_ref:
    description: PR branch ref (e.g., feature/my-feature)
    required: false
  pr_repo:
    description: PR repo full name (e.g., org/repo or user/repo)
    required: false
  base_ref:
    description: Base branch ref (e.g., master)
    required: false
  caller_workflow:
    description: Name of the workflow calling this action
    required: false
    default: None

runs:
  using: 'composite'
  steps:
    # 1) PR code checkout for pull_request / pull_request_target / workflow_call
    - name: Checkout PR code (pull_request / pull_request_target)
      if: ${{ (inputs.event_name == 'pull_request' || inputs.event_name == 'pull_request_target' || inputs.event_name == 'workflow_call') && inputs.pr_ref != '' && inputs.pr_repo != '' }}
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        ref: ${{ inputs.pr_ref }}
        repository: ${{ inputs.pr_repo }}
        path: video-driver

    # 2) Checkout base branch for push / workflow_call (non‑PR)
    - name: Checkout base branch (push / workflow_call)
      if: ${{ (inputs.event_name == 'push' || inputs.event_name == 'workflow_call') && inputs.base_ref != '' && (inputs.pr_ref == '' || inputs.pr_repo == '') }}
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        ref: ${{ inputs.base_ref }}
        path: video-driver

    # 3) Fallback: current repo + ref (push / workflow_call without base_ref or pr_repo)
    - name: Checkout current repo and ref (Fallback)
      if: ${{ (inputs.event_name == 'push' || inputs.event_name == 'workflow_call') && (inputs.base_ref == '' || inputs.pr_repo == '') && inputs.pr_ref == '' }}
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        ref: ${{ github.ref }}
        path: video-driver

    # 4) workflow_dispatch – explicit base_ref
    - name: Checkout for workflow_dispatch
      if: ${{ inputs.event_name == 'workflow_dispatch' }}
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        ref: ${{ inputs.base_ref }}
        path: video-driver

    # 5) Optionally clone kernel sources when called from "build" workflow
    - name: Clone kernel sources
      if: ${{ inputs.caller_workflow == 'build' }}
      uses: actions/checkout@v5
      with:
        repository: qualcomm-linux/kernel
        ref: qcom-next
        path: kernel
        fetch-depth: 0