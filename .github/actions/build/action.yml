name: Build
description: Build the project using a Docker container

inputs:
  machine:
    description: Target machine name
    required: true

  docker_image:
    description: Docker image to use for the build job
    required: true

  kas_file:
    description: KAS file to use for the build job
    required: true

  build_command:
    description: Command to run for the build
    required: false
    default: bitbake core-image-base

  kas_local_conf_header:
    description: Multiline KAS local configuration header
    required: true

runs:
  using: composite
  steps:
    - name: Write KAS overlay and build script
      shell: bash
      env:
        KAS_LOCAL_CONF_HEADER: ${{ inputs.kas_local_conf_header }}
      run: |
        set -euo pipefail

        WORKSPACE_ROOT="$(dirname "$PWD")"
        KAS_CONF_FILE="${WORKSPACE_ROOT}/kas_local_conf_header.txt"
        META_QCOM_DIR="${WORKSPACE_ROOT}/meta-qcom"
        KAS_OVERLAY="${META_QCOM_DIR}/ci_externalsrc_overlay.yml"
        BUILD_SCRIPT="${WORKSPACE_ROOT}/ci_build.sh"

        if [ -z "${KAS_LOCAL_CONF_HEADER:-}" ]; then
          echo "::error::kas_local_conf_header input is empty"
          exit 1
        fi

        if [ ! -d "$META_QCOM_DIR" ]; then
          echo "::error::meta-qcom directory not found: $META_QCOM_DIR"
          exit 1
        fi

        printf '%s' "$KAS_LOCAL_CONF_HEADER" > "$KAS_CONF_FILE"

        if [ ! -s "$KAS_CONF_FILE" ]; then
          echo "::error::KAS configuration file is empty: $KAS_CONF_FILE"
          exit 1
        fi

        echo "=== KAS local configuration header ==="
        cat "$KAS_CONF_FILE"
        echo "======================================="

        printf '%s\n' 'header:' > "$KAS_OVERLAY"
        printf '%s\n' '  version: 14' >> "$KAS_OVERLAY"
        printf '%s\n' '' >> "$KAS_OVERLAY"
        printf '%s\n' 'local_conf_header:' >> "$KAS_OVERLAY"
        printf '%s\n' '  iris-video-ci-override: |' >> "$KAS_OVERLAY"

        while IFS= read -r line || [ -n "$line" ]; do
          printf '    %s\n' "$line" >> "$KAS_OVERLAY"
        done < "$KAS_CONF_FILE"

        echo "=== KAS overlay written ==="
        cat "$KAS_OVERLAY"
        echo "============================"

        rm -f "$BUILD_SCRIPT"

        printf '%s\n' '#!/usr/bin/env bash' >> "$BUILD_SCRIPT"
        printf '%s\n' 'set -euo pipefail' >> "$BUILD_SCRIPT"
        printf '%s\n' '' >> "$BUILD_SCRIPT"

        printf '%s\n' 'echo "=== Inside container ==="' >> "$BUILD_SCRIPT"
        printf '%s\n' 'echo "PWD: $(pwd)"' >> "$BUILD_SCRIPT"
        printf '%s\n' 'echo "MACHINE: ${MACHINE}"' >> "$BUILD_SCRIPT"
        printf '%s\n' 'echo "KAS_FILE: ${KAS_FILE}"' >> "$BUILD_SCRIPT"
        printf '%s\n' 'echo "BUILD_COMMAND: ${BUILD_COMMAND}"' >> "$BUILD_SCRIPT"
        printf '%s\n' '' >> "$BUILD_SCRIPT"

        printf '%s\n' \
          'OVERLAY_FILE="/workspace/meta-qcom/ci_externalsrc_overlay.yml"' \
          >> "$BUILD_SCRIPT"

        printf '%s\n' \
          'if [ ! -f "$OVERLAY_FILE" ]; then' \
          >> "$BUILD_SCRIPT"

        printf '%s\n' \
          '  echo "::error::KAS overlay not found: $OVERLAY_FILE"' \
          >> "$BUILD_SCRIPT"

        printf '%s\n' '  exit 1' >> "$BUILD_SCRIPT"
        printf '%s\n' 'fi' >> "$BUILD_SCRIPT"
        printf '%s\n' '' >> "$BUILD_SCRIPT"

        printf '%s\n' \
          'FULL_KAS_FILE="${KAS_FILE}:../meta-qcom/ci_externalsrc_overlay.yml"' \
          >> "$BUILD_SCRIPT"

        printf '%s\n' \
          'echo "Full KAS file: ${FULL_KAS_FILE}"' \
          >> "$BUILD_SCRIPT"

        printf '%s\n' \
          'echo "Starting build for ${MACHINE}"' \
          >> "$BUILD_SCRIPT"

        printf '%s\n' 'which kas' >> "$BUILD_SCRIPT"
        printf '%s\n' 'kas --version' >> "$BUILD_SCRIPT"
        printf '%s\n' '' >> "$BUILD_SCRIPT"

        printf '%s\n' \
          'kas shell "$FULL_KAS_FILE" -c "$BUILD_COMMAND"' \
          >> "$BUILD_SCRIPT"

        printf '%s\n' '' >> "$BUILD_SCRIPT"

        printf '%s\n' \
          'echo "=== local.conf EXTERNALSRC lines ==="' \
          >> "$BUILD_SCRIPT"

        printf '%s\n' \
          'grep -n "EXTERNALSRC\|EXTERNALSRC_BUILD\|do_fetch\|do_unpack\|do_patch" /workspace/video-driver/build/conf/local.conf || true' \
          >> "$BUILD_SCRIPT"

        chmod +x "$BUILD_SCRIPT"

        echo "=== ci_build.sh written ==="
        cat "$BUILD_SCRIPT"
        echo "==========================="

    - name: Build
      shell: bash
      env:
        MACHINE: ${{ inputs.machine }}
        DOCKER_IMAGE: ${{ inputs.docker_image }}
        KAS_FILE: ${{ inputs.kas_file }}
        BUILD_COMMAND: ${{ inputs.build_command }}
      run: |
        set -euo pipefail

        USER_ID="$(id -u)"
        GROUP_ID="$(id -g)"
        WORKSPACE_ROOT="$(dirname "$PWD")"
        REPO_NAME="$(basename "$PWD")"

        if [ -z "$MACHINE" ]; then
          echo "::error::Machine input is empty"
          exit 1
        fi

        if [ -z "$DOCKER_IMAGE" ]; then
          echo "::error::Docker image input is empty"
          exit 1
        fi

        if [ -z "$KAS_FILE" ]; then
          echo "::error::KAS file input is empty"
          exit 1
        fi

        if [ -z "$BUILD_COMMAND" ]; then
          echo "::error::Build command input is empty"
          exit 1
        fi

        if [ ! -x "${WORKSPACE_ROOT}/ci_build.sh" ]; then
          echo "::error::Build script not found or not executable:"
          echo "${WORKSPACE_ROOT}/ci_build.sh"
          exit 1
        fi

        echo "Machine: $MACHINE"
        echo "Docker image: $DOCKER_IMAGE"
        echo "KAS file: $KAS_FILE"
        echo "Build command: $BUILD_COMMAND"
        echo "Workspace root: $WORKSPACE_ROOT"
        echo "Repository name: $REPO_NAME"

        docker run --rm \
          --user "${USER_ID}:${GROUP_ID}" \
          -v "${WORKSPACE_ROOT}:/workspace" \
          -w "/workspace/${REPO_NAME}" \
          -e "MACHINE=$MACHINE" \
          -e "KAS_FILE=$KAS_FILE" \
          -e "BUILD_COMMAND=$BUILD_COMMAND" \
          "$DOCKER_IMAGE" \
          bash -lc '/workspace/ci_build.sh'