---
name: pre_merge
run-name: Pre Merge Workflow
on:
  workflow_dispatch:
  pull_request: # requiring access to base repo
    types: [opened, synchronize, reopened]
    branches:
      - video.qclinux.0.0

jobs:
  loading:
    uses: qualcomm-linux/video-driver/.github/workflows/loading.yml@video.qclinux.0.0
    secrets: inherit

  build:
    needs: loading
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      build_matrix: ${{ needs.loading.outputs.build_matrix }}
  
  process_image:
    needs: [loading, build]
    uses: ./.github/workflows/process_image.yml
    with:
      build_matrix: ${{ needs.loading.outputs.build_matrix }}

