name: pre_merge

run-name: Pre Merge Workflow

on:
  workflow_dispatch:

  push:
    branches:
      - testing

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - testing

permissions:
  contents: read
  actions: read

jobs:
  loading:
    name: Load build configuration
    uses: qualcomm-linux/video-driver/.github/workflows/loading.yml@testing
    with:
      event_name: ${{ github.event_name }}

  build:
    name: Build
    needs:
      - loading
    uses: qualcomm-linux/video-driver/.github/workflows/sync-and-build.yml@testing
    with:
      build_matrix: ${{ needs.loading.outputs.build_matrix }}
      docker_image: kmake-image:ver.1.0

      commit_sha: >-
        ${{ github.event_name == 'pull_request'
            && github.event.pull_request.head.sha
            || github.sha }}

      source_repository: >-
        ${{ github.event_name == 'pull_request'
            && github.event.pull_request.head.repo.full_name
            || github.repository }}

  owl_build:
    name: OWL parallel kernel and video-driver build
    needs:
      - loading
    uses: qualcomm-linux/video-driver/.github/workflows/owl_build.yml@testing

  create-metadata:
    name: Create build metadata
    needs:
      - loading
      - build
      - owl_build
    runs-on: ubuntu-latest

    steps:
      - name: Create metadata directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/metadata"

      - name: Generate build metadata
        shell: bash
        env:
          BUILD_MATRIX: ${{ needs.loading.outputs.build_matrix }}
          DOCKER_IMAGE: kmake-image:ver.1.0
          EVENT_NAME: ${{ github.event_name }}

          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}

          GITHUB_SHA_VALUE: ${{ github.sha }}
          GITHUB_REPOSITORY_VALUE: ${{ github.repository }}

          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}

        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            COMMIT_SHA="$PR_HEAD_SHA"
            SOURCE_REPOSITORY="$PR_HEAD_REPOSITORY"
          else
            COMMIT_SHA="$GITHUB_SHA_VALUE"
            SOURCE_REPOSITORY="$GITHUB_REPOSITORY_VALUE"
          fi

          if [ -z "${COMMIT_SHA:-}" ] || [ "$COMMIT_SHA" = "null" ]; then
            echo "::error::Unable to determine commit SHA"
            exit 1
          fi

          if [ -z "${SOURCE_REPOSITORY:-}" ] || [ "$SOURCE_REPOSITORY" = "null" ]; then
            echo "::error::Unable to determine source repository"
            exit 1
          fi

          if ! [[ "$COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid commit SHA: $COMMIT_SHA"
            exit 1
          fi

          if ! [[ "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Invalid source repository: $SOURCE_REPOSITORY"
            exit 1
          fi

          if [ -z "${BUILD_MATRIX:-}" ]; then
            echo "::error::Build matrix is empty"
            exit 1
          fi

          echo "$BUILD_MATRIX" | jq empty

          if [ "$(echo "$BUILD_MATRIX" | jq -r 'type')" != "array" ]; then
            echo "::error::Build matrix must be a JSON array"
            exit 1
          fi

          jq -n \
            --arg docker_image "$DOCKER_IMAGE" \
            --argjson build_matrix "$BUILD_MATRIX" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg source_repository "$SOURCE_REPOSITORY" \
            --arg event_name "$EVENT_NAME" \
            --arg build_run_id "$BUILD_RUN_ID" \
            --arg build_run_attempt "$BUILD_RUN_ATTEMPT" \
            --arg repository "$GITHUB_REPOSITORY_VALUE" \
            --arg pr_number "$PR_NUMBER" \
            '{
              docker_image: $docker_image,
              build_matrix: $build_matrix,
              commit_sha: $commit_sha,
              source_repository: $source_repository,
              event_name: $event_name,
              build_run_id: $build_run_id,
              build_run_attempt: $build_run_attempt,
              repository: $repository,
              pr_number: $pr_number
            }' > "$GITHUB_WORKSPACE/metadata/build-metadata.json"

          echo "=== Generated build metadata ==="
          jq . "$GITHUB_WORKSPACE/metadata/build-metadata.json"

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata
          path: ${{ github.workspace }}/metadata/build-metadata.json
          retention-days: 7